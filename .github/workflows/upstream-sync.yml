name: Sync Upstream

on:
  schedule:
    # Runs every hour (adjust cron schedule as needed)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Upstream
        uses: a2ren/fork-sync-action@v1.0.0
        with:
          upstream_repository: 'ORIGINAL_OWNER/ORIGINAL_REPO' # Replace with upstream repo (e.g., vercel/next.js)
          target_branch: 'main' # Replace with your default branch name if different